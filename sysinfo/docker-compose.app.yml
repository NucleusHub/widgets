services:
  sysinfo-server:
    build:
      context: ./server
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "widget-server"
      nucleus.app: "sysinfo"
    # Host access so systeminformation reports the host, not the container.
    pid: host
    privileged: true
    environment:
      PORT: 3010
    volumes:
      - ./server:/app
      - sysinfo_server_modules:/app/node_modules
      - /sys:/sys:ro
      - /:/host:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3010/api/sysinfo/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  sysinfo_server_modules:
