services:
  sysinfo-server:
    build:
      context: ./server
    restart: unless-stopped
    # Host access so systeminformation reports the host, not the container.
    #  • pid: host        → host-wide CPU / memory / load
    #  • /sys mount       → CPU thermal sensors
    #  • / mounted at /host → host root disk usage (see index.js disk logic)
    # GPU / temperature accuracy still depends on host drivers being present.
    pid: host
    privileged: true
    environment:
      PORT: 3010
    volumes:
      - ./server:/app
      - sysinfo_server_modules:/app/node_modules
      - /sys:/sys:ro
      - /:/host:ro
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3010/api/sysinfo/health',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  sysinfo_server_modules:
