services:
  spotify-server:
    build:
      context: ./server
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "widget-server"
      nucleus.app: "spotify"
    environment:
      PORT: 3002
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:-https://${NUCLEUS_HOST:-nucleus.olm-altair.ts.net}/api/spotify/callback}
      SPOTIFY_SUCCESS_REDIRECT: ${SPOTIFY_SUCCESS_REDIRECT:-https://${NUCLEUS_HOST:-nucleus.olm-altair.ts.net}/spotify}
    volumes:
      - ./server:/app
      - spotify_server_modules:/app/node_modules
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3002/api/spotify/status',r=>process.exit(r.statusCode<500?0:1)).on('error',()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  spotify-client:
    build:
      context: ../..
      dockerfile: widgets/spotify/client/Dockerfile
    restart: unless-stopped
    labels:
      nucleus.managed: "true"
      nucleus.stack: "nucleus"
      nucleus.role: "widget-client"
      nucleus.app: "spotify"
    environment:
      API_TARGET: http://spotify-server:3002
      NUCLEUS_HOST: ${NUCLEUS_HOST:-nucleus.olm-altair.ts.net}
    volumes:
      - ./client/src:/app/spotify/client/src
      - ./client/index.html:/app/spotify/client/index.html
      - ./client/vite.config.js:/app/spotify/client/vite.config.js
      - ../core:/app/core
    depends_on:
      spotify-server:
        condition: service_healthy

volumes:
  spotify_server_modules:
